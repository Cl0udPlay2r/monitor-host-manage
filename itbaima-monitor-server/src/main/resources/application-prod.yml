#生产环境配置
server:
  port: 80
springdoc:
  api-docs:
    enabled: false
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
spring:
  influxdb3-core:
    url: "http://localhost:8181"
    database: "monitor"
    token: "apiv3_p3Y4ojB3vTLwJaaUiI40NXUQQ5bnfjxE1iBoMBoJyO-quZCiLG6pTPXvvMfX1xHe-Dzr3brMTDiniGjvK29k5A"
  mail:
    host: smtp.163.com
    username: ${SEND_MAIL}
    password: ${MAIL_KEY}
  rabbitmq:
    addresses: localhost
    username: guest
    password: guest
    virtual-host: /

  datasource:
    url: jdbc:mysql://localhost:3306/monitor
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # HikariCP 默认 connectionTimeout 为 30s，数据库故障时会把 Tomcat 工作线程占住 30 秒
      # 才返回失败（见测试记录 F16）；降级策略定为“拒绝”，这里改为快速失败。
      connection-timeout: 3000
      validation-timeout: 2000
  security:
    jwt:
      key: 'abcdefghijklmn'
      expire: 72
      limit:
        base: 10
        upgrade: 300
        frequency: 30
    filter:
      order: -100
    credential:
      # SSH 等凭据的 AES 加密密钥。生产环境务必用环境变量注入，不要写死在配置文件里。
      key: ${CREDENTIAL_KEY:pi-local-dev-credential-key}
  web:
    verify:
      mail-limit: 60
    flow:
      period: 5
      limit: 100
      block: 30
    cors:
      origin: '*'
      credentials: false
      methods: '*'
  minio:
    endpoint: 'http://localhost:9000'
    username: 'minioadmin'
    password: 'minioadmin'
  data:
    redis:
#      port: 6449
      host: localhost
      port: 6379
      # Lettuce 默认命令超时 60s，Redis 故障时每个已登录请求会挂起 60 秒
      # 后才返回 500（见测试记录 F13）；降级策略定为“拒绝”，这里改为快速失败。
      timeout: 2s
      connect-timeout: 2s